<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>A Secret Message For You...</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #ffe6ea;
      --text-color: #ff4d6d;
      --card-bg: rgba(255, 255, 255, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: var(--text-color);
    }

    /* Floating Hearts Background */
    .hearts-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .heart-float {
      position: absolute;
      bottom: -100px;
      animation: floatUp linear infinite;
      opacity: 0.6;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.5); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translateY(-120vh) scale(1.5); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 10;
      background: var(--card-bg);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(255, 77, 109, 0.15);
      text-align: center;
      max-width: 400px;
      width: 90%;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.5);
      transition: all 0.5s ease;
    }

    /* Locked Screen */
    #lockedScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .lock-icon {
      font-size: 50px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    p.subtitle {
      font-size: 1rem;
      color: #777;
    }

    .scan-hint {
      margin-top: 20px;
      padding: 10px 20px;
      background: #ff4d6d;
      color: white;
      border-radius: 20px;
      font-size: 0.9rem;
      box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
    }

    /* Unlocked Screen */
    #unlockedScreen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .main-gif {
      width: 200px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .buttons-container {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      position: relative;
      width: 100%;
      justify-content: center;
      height: 60px;
    }

    button {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 10px 30px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s;
    }

    #btnYes {
      background-color: #ff4d6d;
      color: white;
      box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
    }

    #btnYes:hover {
      background-color: #ff2a51;
      transform: scale(1.1);
    }

    #btnNo {
      background-color: #fff;
      color: #ff4d6d;
      border: 2px solid #ff4d6d;
      position: absolute;
    }

    /* Celebration Screen */
    #celebrationScreen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
  </style>
</head>
<body>

  <div class="hearts-bg" id="heartsBg"></div>

  <div class="container">
    <!-- LOCKED SCREEN -->
    <div id="lockedScreen">
      <div class="lock-icon">💌</div>
      <h1>A Secret Message</h1>
      <p class="subtitle">Waiting for the magic card...</p>
      <div class="scan-hint">Please tap the RFID card on your phone to unlock!</div>
    </div>

    <!-- UNLOCKED SCREEN (Will you be my GF?) -->
    <div id="unlockedScreen">
      <!-- You can replace this GIF URL with any cute gif you like -->
      <img src="https://media1.tenor.com/m/Z-a-s0H5TIEAAAAC/bubu-dudu-kisses.gif" alt="Cute Bears" class="main-gif">
      <h1>Will you be my girlfriend?</h1>
      <p class="subtitle">I've been wanting to ask you this for a while...</p>
      
      <div class="buttons-container">
        <button id="btnYes">YES! 💖</button>
        <button id="btnNo">No 😢</button>
      </div>
    </div>

    <!-- CELEBRATION SCREEN -->
    <div id="celebrationScreen">
      <img src="https://media1.tenor.com/m/0sEWj18tPukAAAAC/bubu-dudu.gif" alt="Happy Bears" class="main-gif">
      <h1>YAYYYY! 🎉</h1>
      <p class="subtitle">I'm the happiest person right now! Love you! ❤️</p>
    </div>
  </div>

  <script>
    // --- Create Floating Hearts ---
    function createHearts() {
      const heartsBg = document.getElementById('heartsBg');
      const heartIcons = ['❤️', '💖', '💕', '💘'];
      
      for (let i = 0; i < 20; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart-float';
        heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
        heart.style.animationDelay = Math.random() * 5 + 's';
        heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
        heartsBg.appendChild(heart);
      }
    }

    createHearts();

    // --- Check URL Parameters ---
    const params = new URLSearchParams(window.location.search);
    const isActivated = params.get('activated') === 'true';

    const lockedScreen = document.getElementById('lockedScreen');
    const unlockedScreen = document.getElementById('unlockedScreen');
    const celebrationScreen = document.getElementById('celebrationScreen');
    const btnYes = document.getElementById('btnYes');
    const btnNo = document.getElementById('btnNo');

    if (isActivated) {
      lockedScreen.style.display = 'none';
      unlockedScreen.style.display = 'flex';
      
      // Set initial positions for buttons
      btnYes.style.left = '0';
      btnNo.style.right = '0';
    }

    // --- "No" Button Runaway Logic ---
    btnNo.addEventListener('mouseover', moveNoButton);
    btnNo.addEventListener('touchstart', moveNoButton); // For mobile

    function moveNoButton(e) {
      if(e.type === 'touchstart') e.preventDefault();
      
      const container = document.querySelector('.container');
      const containerRect = container.getBoundingClientRect();
      const btnRect = btnNo.getBoundingClientRect();

      const maxX = containerRect.width - btnRect.width - 20;
      const maxY = 60; // relative to the buttons container height

      const randomX = Math.max(0, Math.floor(Math.random() * maxX));
      const randomY = Math.floor(Math.random() * maxY) - (maxY/2);

      btnNo.style.position = 'absolute';
      btnNo.style.left = randomX + 'px';
      btnNo.style.transform = `translateY(${randomY}px)`;
    }

    // --- "Yes" Button Click ---
    btnYes.addEventListener('click', () => {
      unlockedScreen.style.display = 'none';
      celebrationScreen.style.display = 'flex';
    });
  </script>
</body>
</html>
